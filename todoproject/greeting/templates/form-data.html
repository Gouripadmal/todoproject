<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
</head>
<body>

    <h2>Welcome {{ username }},</h2>

    <h3>Form Data Received:</h3>

    <table border="1">
        {% for x, y in formData.items %}
        <tr>
            <td>{{ x }}</td>
            <td>{{ y }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>

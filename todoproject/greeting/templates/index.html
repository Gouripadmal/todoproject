<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>
<body>

    <h1>Registration</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Full Name</label><br>
        <input type="text" name="full_name" value="{{ form.full_name.value|default:'' }}"><br>
        {{ form.full_name.errors }}

        <br>

        <label>Email</label><br>
        <input type="email" name="email" value="{{ form.email.value|default:'' }}"><br>
        {{ form.email.errors }}

        <br>

        <label>Password</label><br>
        <input type="password" name="password"><br>
        {{ form.password.errors }}

        <br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
